# Packaging config for Bibliofile (electron-builder).
#
# Two-package.json layout: the dev deps + this config live at the repo root; the
# Electron app (its `main`, version, and runtime deps) is `app/`. electron-vite
# bundles the renderer/preload/main, externalising ONLY the native `better-sqlite3`
# — so the packaged app is `app/out/**` plus that one native module (asar-unpacked).
#
# Native rebuild for the Electron ABI is done by `scripts/rebuild-native.mjs
# electron` before packaging (see the root `pack`/`dist` scripts), so npmRebuild is
# off here.
#
# Signing: macOS builds are signed with the Developer ID Application cert
# auto-discovered from the login keychain (no `identity` field) and then notarized
# + stapled by the afterSign hook below. Set CSC_IDENTITY_AUTO_DISCOVERY=false to
# force an unsigned build (the `pack:dir` dev script does this); the afterSign hook
# self-skips when the APPLE_* env vars are absent.
appId: com.jmckalex.bibliofile
productName: Bibliofile
copyright: © 2026 J. McKenzie Alexander
# Pinned because electron-builder can't auto-detect Electron through pnpm's
# symlinked layout with `directories.app`. Keep in sync with app's electron devDep.
electronVersion: 33.4.11

directories:
  app: app # the Electron application directory (app/package.json)
  output: release # built installers land in ./release (repo root)
  buildResources: build # icons + entitlements live in ./build (repo root)

# Relative to the app dir (app/). The whole app is bundled into out/**; the OCR
# stack and better-sqlite3 are externalized (not bundled), so electron-builder
# collects them from the production dependency tree into the asar (see asarUnpack).
files:
  - out/**/*
  - package.json

# On-disk resources the MAIN process probes for at runtime (they are NOT bundled
# into out/**, and without this key the packaged app finds none of them and each
# degrades silently). `from` is resolved against the PROJECT dir (repo root — the
# `directories.app: app` split), `to` against Contents/Resources/. The `to` paths
# match the resolvers exactly:
#   - tessdataDir()   → process.resourcesPath/tessdata            (index.ts)
#   - findJournalsDir → <appPath>/../resources/journals           (journal-covers.ts)
#   - findHelpDir     → <appPath>/../docs/help                    (help.ts); the
#     manual's `../viewer-*.png` image refs resolve to <helpDir>/../<img>, i.e.
#     Contents/Resources/docs/<img>, so the screenshots go alongside at docs/.
# VERIFY after a `pnpm pack:dir`: release/mac-*/Bibliofile.app/Contents/Resources/
# should contain tessdata/, resources/journals/, docs/help/, docs/*.png.
extraResources:
  - from: app/resources/tessdata
    to: tessdata
  - from: app/resources/journals
    to: resources/journals
  - from: docs/help
    to: docs/help
  - from: docs
    to: docs
    filter: ['*.png']
# NOTE — the macOS AppleScript addon (bibliophile_scripting.node → scripting-bridge
# addonCandidates()) is deliberately NOT bundled yet: the .node is gitignored, built
# for a specific ABI, and NOT rebuilt by the `dist` script, so bundling it as-is would
# either break the build on a missing file or ship a wrong-ABI binary. Wire an
# Electron-ABI addon build into the `dist` script first, then add:
#   - from: app/native/scripting/build/Release/bibliophile_scripting.node
#     to: bibliophile_scripting.node
# Until then AppleScript automation degrades gracefully (logs "not built") when packaged.

# Native .node binaries can't live inside the asar. The OCR deps are externalized and
# collected into the asar, but must be UNPACKED to real file paths: tesseract.js spawns
# a worker_threads script by path, tesseract.js-core reads its WASM from disk,
# @napi-rs/canvas loads a per-arch native binding, and pdfjs-dist is loaded via a
# file-URL import() (+ its standard_fonts/). pdf-lib is pure JS and can stay packed.
asarUnpack:
  - '**/*.node'
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@napi-rs/canvas/**
  # The actual skia native binary lives in the per-arch sibling package (declared as
  # an optionalDependency of the app so electron-builder collects it); unpack it so
  # @napi-rs/canvas's `require('@napi-rs/canvas-darwin-<arch>')` resolves a real file.
  - node_modules/@napi-rs/canvas-darwin-arm64/**
  - node_modules/@napi-rs/canvas-darwin-x64/**
  - node_modules/pdfjs-dist/**

npmRebuild: false # we rebuild better-sqlite3 for Electron ourselves (see scripts)

# Notarize + staple the signed .app (skips itself without APPLE_* env vars).
afterSign: scripts/notarize.cjs
# Code-sign + notarize + staple the .dmg itself (the .app's signature/ticket
# don't cover the dmg container — different cdhash). Same self-skip when APPLE_*
# are unset.
afterAllArtifactBuild: scripts/notarize-dmg.cjs

# Always tag the dmg with its arch, so the Intel (x64) and Apple-Silicon (arm64)
# disk images have distinct names side by side in ./release.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false # we notarize separately via the afterSign hook
  # electron-builder's own notarize step is off; our afterSign hook handles it so
  # we control bundle id + stapling. With no `identity` set, electron-builder
  # auto-discovers the "Developer ID Application" cert from the login keychain.
  notarize: false

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
  category: Office
