name: CI

# Lint + typecheck + bundler build + test on every push to main and every PR.
# Runs on macOS because the native toolchain script (scripts/rebuild-native.mjs)
# and better-sqlite3's build assume a Unix/Xcode toolchain, and macOS is the dev +
# release platform. `audit-fixes` is included so the current work branch is checked
# before it merges (remove it once merged).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    # Nothing in this job launches Electron (build:app is a bundler build, tests are
    # headless), so skip the ~100 MB Electron binary download — faster + one fewer
    # network dependency to flake on.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      # pnpm first, so setup-node's `cache: pnpm` can find it. Version comes from
      # the root package.json `packageManager` field (pnpm@11.2.2).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A fresh install builds better-sqlite3 for THIS node's ABI (approved in
      # pnpm-workspace.yaml onlyBuiltDependencies) and applies the electron-vite
      # patch — so the FTS5 tests, which skip locally against the app's Electron
      # ABI, actually run here.
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (tsc, all packages)
        run: pnpm build

      - name: Bundler build (electron-vite — catches errors tsc misses)
        run: pnpm build:app

      # The FTS5 tests self-skip when better-sqlite3 can't load (graceful degradation),
      # which would let a broken native build pass as GREEN. Assert it loads for this
      # node ABI so those tests actually run — and fail loudly here if it doesn't.
      - name: Assert native better-sqlite3 + FTS5 is available
        working-directory: app
        run: node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('CREATE VIRTUAL TABLE t USING fts5(x)');db.close();console.log('better-sqlite3 + FTS5 OK')"

      # The macOS bookmark addon writes the `bookmark` blob that makes our
      # attachments byte-compatible with BibDesk's. Its tests self-skip when it
      # isn't built, so build it here or they would silently never run. Node-API,
      # so the `node` target's binary is equally valid for the packaged Electron
      # app — no per-ABI rebuild, and no Electron headers to fetch in CI.
      - name: Build the macOS bookmark addon
        run: node scripts/build-bookmark-addon.mjs node

      - name: Assert bookmark generation works
        run: node -e "const bm=require('./app/native/bookmark/build/Release/bibliophile_bookmark.node');const b=bm.create(process.cwd());if(!b||b.subarray(0,4).toString()!=='book')throw new Error('bookmark creation failed');console.log('bookmark addon OK')"

      # Runs after build:app so the built renderer exists for the prod-CSP
      # build-output test. TeX-preview tests self-skip when TeX isn't installed.
      - name: Test
        run: pnpm test
